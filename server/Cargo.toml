[package]
name = "personal-website_server"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.97"
argon2 = "0.5.3"
async-graphql = "7.0.15"
async-graphql-axum = "7.0.15"
async-trait = "0.1.87"
dotenvy = "0.15.7"
env_logger = "0.11.6"
futures = "0.3.31"
redis = "0.29.1"
serde = "1.0.219"
serde_json = "1.0.140"
thiserror = "2.0.12"
tracing = "0.1.41"

tokio = { version = "1.44.0", features = ["full"] }
#tokio = { version = "1.44.0", features = ["rt", "rt-multi-thread"] }

axum = { version = "0.8.1", features = ["macros"] }
axum-extra = { version = "0.10.0", features = ["cookie"] }

tower = { version = "0.5.2", features = ["timeout"] }
tower-http = { version = "0.6.2", features = ["cors", "trace"] }

time = { version = "0.3.39", features = ["serde"] }
tracing-subscriber = { version = "0.3.19", features = ["env-filter"] }
reqwest = { version = "0.12.12", features = ["json"] }
tokio-cron-scheduler = { version = "0.13.0", features = ["signal"] }
envy = "0.4.2"
once_cell = "1.21.0"

[package]
name = "personal-website_server"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
argon2 = "0.5.3"
async-graphql = "7.2.1"
async-graphql-axum = "7.2.1"
async-trait = "0.1.92"
dotenvy = "0.15.7"
env_logger = "0.11.11"
futures = "0.3.34"
redis = "0.29.5"
serde = "1.0.229"
serde_json = "1.0.151"
thiserror = "2.0.20"
tracing = "0.1.44"

tokio = { version = "1.53.1", features = ["full"] }
#tokio = { version = "1.44.0", features = ["rt", "rt-multi-thread"] }

axum = { version = "0.8.9", features = ["macros"] }
axum-extra = { version = "0.10.3", features = ["cookie"] }

tower = { version = "0.5.3", features = ["timeout"] }
tower-http = { version = "0.6.11", features = ["cors", "trace"] }

time = { version = "0.3.55", features = ["serde"] }
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
reqwest = { version = "0.12.28", features = ["json"] }
tokio-cron-scheduler = { version = "0.13.0", features = ["signal"] }
envy = "0.4.2"
once_cell = "1.21.4"
